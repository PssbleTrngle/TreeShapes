modLoader = "kotlinforforge"
loaderVersion = "[5,)"
license = "https://github.com/${repository}/blob/1.21.x/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues"
updateJSONURL = "https://api.modrinth.com/updates/tree-shapes/forge_updates.json?neoforge=only"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
versionRange = "[5.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
